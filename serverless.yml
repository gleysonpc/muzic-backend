service: muzic-backend

plugins:
  - serverless-offline

provider:
  name: aws
  runtime: nodejs20.x
  memorySize: 256
  region: "us-east-1"
  deploymentMethod: direct
  versionFunctions: false
  stage: ${opt:stage, 'dev'}

functions:
  main:
    handler: dist/main.handler
    events:
      - http:
          method: ANY
          path: /hello
      - http:
          method: ANY
          path: "{proxy+}"

resources:
  Resources:
    UsersTable: ${file(src/users/resources/muzic-users-table.yml):UsersTable}

custom:
  UsersTable:
    name: !Ref UsersTable
    arn: !GetAtt UsersTable.Arn
    # arn: arn:aws:dynamodb:${self:provider.region}:*:table/MuzicUsersTable-${self:provider.stage}
