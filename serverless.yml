service: muzic-backend

plugins:
  - serverless-offline

provider:
  name: aws
  runtime: nodejs20.x
  memorySize: 256
  region: 'us-east-1'
  deploymentMethod: direct
  versionFunctions: false
  stage: ${opt:stage, 'dev'}

functions:
  main:
    handler: dist/main.handler
    events:
      - http:
          method: ANY
          path: /hello
      - http:
          method: ANY
          path: '{proxy+}'